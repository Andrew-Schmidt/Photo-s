<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Photo Albums{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><header class="site-header"><a class="brand" href="{{ url_for('index') }}">◈ &nbsp;Photo Albums</a>{% if session.get('logged_in') %}<form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="quiet" type="submit">Sign out</button></form>{% endif %}</header><main class="container">{% for category,message in get_flashed_messages(with_categories=true) %}<div class="notice {{ category }}">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main><footer>Private photo collection</footer></body></html>
